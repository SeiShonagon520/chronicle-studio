<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Chronicle Studio Starter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1b17; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<canvas id="stage"></canvas>
<script type="module">
  import {
    MOTION_DUR,
    clamp01,
    easeOutQuint,
    easeOutExpo,
    criticallyDampedSpring,
    textCrossfadeWeights,
    QuinticHermiteSpline,
    isReducedMotion,
  } from '/@core/lib/motion.js';
  import { withSeed } from '/@core/lib/prng.js';

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let TL = null;

  // Deterministic offscreen warm parchment texture anchored in world space
  function makeParchmentTile(w, h) {
    const off = document.createElement('canvas');
    off.width = w;
    off.height = h;
    const octx = off.getContext('2d');
    octx.fillStyle = '#EFE6D2';
    octx.fillRect(0, 0, w, h);

    withSeed('chronicle-paper-v1', (rng) => {
      // Subtle organic cotton paper fibers
      for (let i = 0; i < 900; i++) {
        const x = rng() * w;
        const y = rng() * h;
        const len = 8 + rng() * 28;
        const ang = rng() * Math.PI * 2;
        octx.strokeStyle = rng() > 0.5 ? 'rgba(95, 76, 52, 0.045)' : 'rgba(255, 250, 240, 0.08)';
        octx.lineWidth = 1;
        octx.beginPath();
        octx.moveTo(x, y);
        octx.quadraticCurveTo(
          x + Math.cos(ang + 0.3) * len * 0.5,
          y + Math.sin(ang + 0.3) * len * 0.5,
          x + Math.cos(ang) * len,
          y + Math.sin(ang) * len
        );
        octx.stroke();
      }
      // Subtle grid lines
      octx.strokeStyle = 'rgba(130, 114, 92, 0.14)';
      octx.lineWidth = 1;
      for (let gx = 0; gx < w; gx += 120) {
        octx.beginPath(); octx.moveTo(gx, 0); octx.lineTo(gx, h); octx.stroke();
      }
      for (let gy = 0; gy < h; gy += 120) {
        octx.beginPath(); octx.moveTo(0, gy); octx.lineTo(w, gy); octx.stroke();
      }
    });
    return off;
  }

  let paperTile = null;

  const camSpline = new QuinticHermiteSpline([
    { t: 0.0, v: [0, 0, 1.0] },
    { t: 2.2, v: [-55, -22, 1.07] },
    { t: 3.8, v: [-95, -40, 1.12] },
    { t: 6.0, v: [-115, -48, 1.15] },
  ]);

  function getActiveSub(t) {
    if (!TL || !Array.isArray(TL.subtitles)) return null;
    return TL.subtitles.find((s) => t >= s.t0 && t <= s.t1) || null;
  }

  window.TEXTS = function (t) {
    const W = canvas.width;
    const H = canvas.height;
    const items = [];
    // Persistent left title card (stays inside Bilibili safe zone: x>=76, y>=68)
    if (t >= 0.1) {
      items.push({
        id: 'header_title',
        text: 'CHRONICLE STUDIO · 六步门禁管线',
        x0: 76,
        y0: 68,
        x1: 540,
        y1: 122,
        pass: false,
      });
    }
    // State-transition concise status pill (swaps smoothly around t=2.70s..3.22s without ghosting)
    if (t < 2.88) {
      items.push({
        id: 'status_phase',
        text: '01 · 风格定稿',
        x0: W - 406,
        y0: 68,
        x1: W - 76,
        y1: 126,
        pass: false,
      });
    } else if (t >= 3.05) {
      items.push({
        id: 'status_phase',
        text: '04 · 切片验收',
        x0: W - 406,
        y0: 68,
        x1: W - 76,
        y1: 126,
        pass: false,
      });
    }
    const sub = getActiveSub(t);
    if (sub) {
      items.push({
        id: 'subtitle_bar',
        text: sub.zh,
        x0: Math.round(W * 0.2),
        y0: H - 140,
        x1: Math.round(W * 0.8),
        y1: H - 58,
        pass: true, // subtitles checked separately via .srt timing
      });
    }
    return items;
  };

  window.render = function (t) {
    const W = innerWidth || 1920;
    const H = innerHeight || 1080;
    if (canvas.width !== W || canvas.height !== H) {
      canvas.width = W;
      canvas.height = H;
      paperTile = makeParchmentTile(W + 400, H + 400);
    }

    const reduced = isReducedMotion();
    const [camX, camY, zoom] = reduced ? [0, 0, 1.0] : camSpline.eval(t);

    ctx.save();
    ctx.clearRect(0, 0, W, H);

    // 1. World-anchored paper ground & schematic route
    ctx.save();
    ctx.translate(W / 2 + camX, H / 2 + camY);
    ctx.scale(zoom, zoom);
    ctx.translate(-W / 2, -H / 2);

    ctx.drawImage(paperTile, -200, -200);

    // Crisp schematic arc connecting two world anchors
    const pA = { x: W * 0.34, y: H * 0.56 };
    const pB = { x: W * 0.68, y: H * 0.44 };
    const routeU = easeOutQuint(clamp01((t - 0.35) / 3.2));

    ctx.strokeStyle = '#B82925';
    ctx.lineWidth = 4;
    ctx.setLineDash([12, 8]);
    ctx.beginPath();
    ctx.moveTo(pA.x, pA.y);
    const curX = pA.x + (pB.x - pA.x) * routeU;
    const curY = pA.y + (pB.y - pA.y) * routeU - Math.sin(Math.PI * routeU) * 75;
    ctx.quadraticCurveTo((pA.x + curX) * 0.5, pA.y - 90 * routeU, curX, curY);
    ctx.stroke();
    ctx.setLineDash([]);

    // Anchor medallions
    for (const [pt, label, delay] of [[pA, '1914.06 · 起点标定', 0.15], [pB, 'Phase 04 · 切片终点', 2.20]]) {
      const sp = criticallyDampedSpring(t - delay, 0.14);
      if (sp > 0.01) {
        ctx.save();
        ctx.globalAlpha = sp;
        ctx.fillStyle = '#23211E';
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 9, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#B8964C';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 16, 0, Math.PI * 2); ctx.stroke();

        ctx.font = 'bold 24px "SimSun", "Noto Serif SC", serif';
        ctx.fillStyle = '#23211E';
        ctx.fillText(label, pt.x + 24, pt.y + 8 - (1 - sp) * 8);
        ctx.restore();
      }
    }
    ctx.restore();

    // Gentle paper vignette
    const grad = ctx.createRadialGradient(W * 0.5, H * 0.5, H * 0.35, W * 0.5, H * 0.5, W * 0.72);
    grad.addColorStop(0, 'rgba(35,33,30,0)');
    grad.addColorStop(1, 'rgba(35,33,30,0.22)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 2. Top-left Brand Card (inside Bilibili safe margins: x=76, y=68)
    const entryA = easeOutExpo(clamp01((t - 0.08) / MOTION_DUR.T_UI));
    ctx.save();
    ctx.globalAlpha = entryA;
    ctx.translate(76, 68 + (1 - entryA) * 10);
    ctx.fillStyle = 'rgba(248, 242, 229, 0.94)';
    ctx.strokeStyle = '#B8964C';
    ctx.lineWidth = 2;
    ctx.fillRect(0, 0, 444, 52);
    ctx.strokeRect(0, 0, 444, 52);
    ctx.fillStyle = '#23211E';
    ctx.font = 'bold 22px "SimSun", "Noto Serif SC", serif';
    ctx.fillText('CHRONICLE STUDIO · 六步门禁管线', 18, 34);
    ctx.restore();

    // 3. Top-right State Card demonstrating non-ghosting textCrossfadeWeights & continuous background morph
    const morphU = clamp01((t - 2.70) / MOTION_DUR.T_MORPH);
    const { wOld, wNew, yOldOffset, yNewOffset } = textCrossfadeWeights(morphU);
    const rCard = Math.round(38 + (184 - 38) * easeOutQuint(morphU));
    const gCard = Math.round(75 + (41 - 75) * easeOutQuint(morphU));
    const bCard = Math.round(122 + (37 - 122) * easeOutQuint(morphU));
    const cardW = 330;
    const cardX = W - 76 - cardW;
    ctx.save();
    ctx.fillStyle = `rgba(${rCard}, ${gCard}, ${bCard}, 0.92)`;
    ctx.strokeStyle = '#E8DCC4';
    ctx.lineWidth = 2;
    ctx.fillRect(cardX, 68, cardW, 56);
    ctx.strokeRect(cardX, 68, cardW, 56);
    ctx.font = 'bold 22px "SimSun", "Noto Serif SC", serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#F7F1E3';
    if (wOld > 0.01) {
      ctx.globalAlpha = wOld;
      ctx.fillText('01 · 风格定稿', cardX + cardW / 2, 103 + yOldOffset);
    }
    if (wNew > 0.01) {
      ctx.globalAlpha = wNew;
      ctx.fillText('04 · 切片验收', cardX + cardW / 2, 103 + yNewOffset);
    }
    ctx.restore();

    // 4. Bottom Bilingual Subtitles (safely above Bottom>=54px margin)
    const sub = getActiveSub(t);
    if (sub) {
      const fadeIn = easeOutQuint(clamp01((t - sub.t0) / 0.22));
      const fadeOut = 1 - easeOutQuint(clamp01((t - (sub.t1 - 0.18)) / 0.18));
      ctx.save();
      ctx.globalAlpha = Math.min(fadeIn, fadeOut);
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(239, 230, 210, 0.86)';
      ctx.fillRect(W * 0.2, H - 142, W * 0.6, 84);
      ctx.fillStyle = '#1E1B18';
      ctx.font = 'bold 34px "SimSun", "Noto Serif SC", serif';
      ctx.fillText(sub.zh, W * 0.5, H - 100);
      ctx.fillStyle = '#52493E';
      ctx.font = 'italic 20px "Georgia", serif';
      ctx.fillText(sub.en, W * 0.5, H - 70);
      ctx.restore();
    }

    ctx.restore();
  };

  async function init() {
    const resp = await fetch('/timeline.json');
    TL = await resp.json();
    window.DUR = TL.meta.duration;
    window.EV = TL.events || [];
    window.READY = true;
  }
  init();
</script>
</body>
</html>
